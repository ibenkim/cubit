<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cubit — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&family=Plus+Jakarta+Sans:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="static/css/styles.css" />
</head>
<body class="auth-body">
  <header class="auth-header">
    <a href="index.html" class="logo" aria-label="cubit home">
      <span class="logo__mark" aria-hidden="true"></span>
      <span class="logo__wordmark">cubit</span>
    </a>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 class="auth-card__title" id="auth-title">Sign in</h1>

      <div class="auth-error" id="login-error" hidden>
        Incorrect username or password.
      </div>

      <form class="auth-form" id="login-form" novalidate>
        <div class="auth-field">
          <label class="auth-field__label" for="login-username">Username</label>
          <input
            type="text"
            id="login-username"
            class="auth-field__input"
            name="username"
            autocomplete="username"
            required
          />
        </div>

        <div class="auth-field">
          <label class="auth-field__label" for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            class="auth-field__input"
            name="password"
            autocomplete="current-password"
            required
          />
          <a href="#" class="auth-field__helper">Forgot password?</a>
        </div>

        <div class="auth-divider" role="separator" aria-label="or">
          <span class="auth-divider__line" aria-hidden="true"></span>
          <span class="auth-divider__label">or</span>
          <span class="auth-divider__line" aria-hidden="true"></span>
        </div>

        <button type="button" class="auth-google" id="google-signin">
          <span class="auth-google__icon" aria-hidden="true"></span>
          <span>Continue with Google</span>
        </button>

        <p class="auth-meta">
          Need an account?
          <a href="#" class="auth-meta__link">Sign up today</a>
        </p>

        <div class="auth-card__cta">
          <button type="submit" class="btn-pill btn-pill--muted btn-pill--auth">
            Log in
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="static/js/main.js" defer></script>
</body>
</html>
